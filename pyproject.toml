[tool.poetry]
name = "mdit-py-i18n"
version = "0.2.1"
description = "Markdown i18n and l10n using markdown-it-py"
authors = ["Phu Hung Nguyen <phuhnguyen@outlook.com>"]
license = "LGPL-2.1-or-later"
readme = "README.md"
repository = "https://github.com/phunh/mdit-py-i18n"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Internationalization",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3"
]
packages = [{include = "mdit_py_i18n"}]

[tool.poetry.dependencies]
python = "^3.8"
markdown-it-py = {extras = ["plugins"], version = "^3.0.0"}
Pygments = "^2.16.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.tox]
requires = ["tox>=4.19"]
envlist = ["sort-imports"]

[tool.tox.env.tests]
description = "Runs pytest"
deps = ["pytest"]
commands = [["pytest"]]

[tool.tox.env.lint]
description = "runs flake8"
skip_install = true
deps = ["flake8==7.3.0"]
commands = [["flake8", "."]]

[tool.tox.env.check-imports]
description = "runs isort --check"
skip_install = true
deps = ["isort==7.0.0"]
commands = [["isort", "--check", "."]]

[tool.tox.env.sort-imports]
description = "runs isort"
skip_install = true
deps = ["isort==7.0.0"]
commands = [["isort", "."]]

[tool.tox.env.format]
description = "runs black"
skip_install = true
deps = ["black==25.12.0"]
commands = [["black", "."]]
